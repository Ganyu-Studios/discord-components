name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  BuildAndLint:
    name: BuildingAndLinting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Add problem matcher
        run: |
          echo "::add-matcher::.github/problemMatchers/eslint.json"
          echo "::add-matcher::.github/problemMatchers/tsc.json"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Code
        run: pnpm build:core && pnpm build:react && pnpm build:react-render
      - name: Run ESLint
        run: pnpm lint --fix=false
      - name: Publish preview to pkg.pr.new
        if: github.repository == 'Ganyu-Studios/discord-components'
        run: pnpm dlx pkg-pr-new publish './packages/core' './packages/react' './packages/react-render'
        env:
          # pkg-pr-new rewrites workspace:^ dependencies to preview urls before packing, so the
          # lockfile no longer matches the manifests. Packing runs each package's prepack through
          # pnpm, and pnpm 12 checks the lockfile before running a script and aborts on that
          # mismatch. The install step above already verified the real lockfile.
          pnpm_config_verify_deps_before_run: 'false'
