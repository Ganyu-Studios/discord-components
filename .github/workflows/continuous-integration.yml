name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  BuildAndLint:
    name: BuildingAndLinting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Add problem matcher
        run: |
          echo "::add-matcher::.github/problemMatchers/eslint.json"
          echo "::add-matcher::.github/problemMatchers/tsc.json"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Code
        run: pnpm build:core && pnpm build:react && pnpm build:react-render
      - name: Run ESLint
        run: pnpm lint --fix=false
